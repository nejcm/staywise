[build]
command = "bun run netlify:build"
publish = "dist/client"

[build.environment]
BUN_VERSION = "1.4.3"
# AWS_LAMBDA_JS_RUNTIME=nodejs24.x and the fra function region are site settings, not netlify.toml.
# APP_ENV and AWS_LAMBDA_JS_RUNTIME hold plain words (e.g. "production"), APP_ORIGIN a public URL that supabase/config.toml repeats; the scan matches them in source.
SECRETS_SCAN_OMIT_KEYS = "APP_ENV,AWS_LAMBDA_JS_RUNTIME,APP_ORIGIN"

[functions]
included_files = ["certs/**"]

# Vite fingerprints everything under /assets; Netlify's default (max-age=0, must-revalidate) re-validates each chunk on every page load.
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
