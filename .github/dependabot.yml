version: 2

updates:
  - package-ecosystem: bun
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
